<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Registry — By Last Designation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20262E;
    --ink-soft:#4B5561;
    --steel:#33506B;
    --steel-deep:#1F3A4D;
    --brass:#A9803F;
    --brass-soft:#C9A46B;
    --paper:#EFECE3;
    --paper-card:#F8F6F0;
    --line:#D8D2C2;
    --line-soft:#E5E1D4;
    --ok:#4C7A5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--brass-soft); color:#1a1a1a;}

  /* ===== Header ===== */
  header{
    background:var(--steel-deep);
    color:#EFECE3;
    padding:28px 32px 24px;
    border-bottom:4px solid var(--brass);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    top:0; right:-40px;
    width:220px; height:220px;
    background:repeating-linear-gradient(45deg, rgba(201,164,107,0.07) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass-soft);
    margin-bottom:8px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .subhead{
    color:#C7CDD3;
    font-size:14px;
    max-width:640px;
    line-height:1.5;
  }
  .stats-row{
    display:flex;
    gap:28px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .stat{
    font-family:'IBM Plex Mono',monospace;
  }
  .stat .num{
    font-size:22px;
    font-weight:600;
    color:#fff;
  }
  .stat .lbl{
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#9DAAB4;
  }

  /* ===== Layout ===== */
  .wrap{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:0;
    max-width:1400px;
    margin:0 auto;
    min-height:calc(100vh - 150px);
  }
  @media (max-width:880px){
    .wrap{grid-template-columns:1fr;}
  }

  /* ===== Sidebar: designation index ===== */
  .sidebar{
    border-right:1px solid var(--line);
    background:var(--paper-card);
    padding:20px 0 60px;
  }
  .sidebar-head{
    padding:0 20px 14px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:6px;
  }
  .sidebar-head .tab-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .search-box{
    margin:12px 20px 4px;
  }
  .search-box input{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
  }
  .search-box input:focus{
    outline:2px solid var(--brass-soft);
    outline-offset:1px;
  }
  .designation-list{
    list-style:none;
    margin:10px 0 0;
    padding:0;
    max-height:calc(100vh - 260px);
    overflow-y:auto;
  }
  .designation-list::-webkit-scrollbar{width:8px;}
  .designation-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .desig-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 20px;
    cursor:pointer;
    border-left:3px solid transparent;
    font-size:13.5px;
    color:var(--ink);
    transition:background .12s ease;
  }
  .desig-item:hover{background:var(--paper);}
  .desig-item.active{
    background:#fff;
    border-left:3px solid var(--brass);
    font-weight:600;
  }
  .desig-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .desig-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#fff;
    background:var(--steel);
    padding:1px 7px;
    border-radius:10px;
    flex-shrink:0;
    min-width:20px;
    text-align:center;
  }
  .desig-item.active .desig-count{background:var(--brass);}

  /* ===== Main panel ===== */
  .main{
    padding:26px 32px 60px;
  }
  .main-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }
  .main-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    margin:0;
    color:var(--steel-deep);
  }
  .main-head .count-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .name-search-box{
    margin-bottom:16px;
  }
  .filters-row{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .filters-row .name-search-box{
    margin-bottom:0;
    flex:1;
    min-width:200px;
  }
  .gender-filter{
    display:flex;
    gap:6px;
  }
  .gender-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.03em;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .12s ease;
  }
  .gender-chip:hover{
    border-color:var(--brass-soft);
    color:var(--ink);
  }
  .gender-chip.active{
    background:var(--steel-deep);
    border-color:var(--steel-deep);
    color:#fff;
  }
  .name-search-box input{
    width:100%;
    max-width:360px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper-card);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    outline:none;
  }
  .name-search-box input:focus{
    border-color:var(--brass-soft);
  }
  .card-resume{
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--steel);
    font-weight:600;
    text-decoration:none;
  }
  .card-resume:hover{color:var(--brass);}
  .card-no-resume{
    margin-top:8px;
    display:inline-block;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    opacity:.6;
  }

  .candidate-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
  }
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    cursor:pointer;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:14px; bottom:14px;
    width:3px;
    background:var(--line);
    border-radius:2px;
    transition:background .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(32,38,46,0.12);
    border-color:var(--brass-soft);
  }
  .card:hover::before{background:var(--brass);}
  .card-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--ink);
    margin-bottom:3px;
  }
  .card-desig{
    font-size:12px;
    color:var(--steel);
    margin-bottom:8px;
    font-weight:500;
  }
  .card-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .card-meta span{white-space:nowrap;}
  .card-link{
    margin-top:10px;
    font-size:11.5px;
    color:var(--brass);
    font-weight:600;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .card-link::after{content:"→"; transition:transform .12s ease;}
  .card:hover .card-link::after{transform:translateX(3px);}

  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ===== Modal: candidate file ===== */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(20,24,29,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
    z-index:100;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper-card);
    max-width:560px;
    width:100%;
    border-radius:8px;
    border:1px solid var(--line);
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    overflow:hidden;
    animation:riseIn .16s ease;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .modal-top{
    background:var(--steel-deep);
    color:#fff;
    padding:20px 24px;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:14px; right:16px;
    background:none;
    border:none;
    color:#C7CDD3;
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:4px 8px;
  }
  .modal-close:hover{color:#fff;}
  .modal-id{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--brass-soft);
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .modal-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:700;
    margin:4px 0 2px;
  }
  .modal-desig{
    font-size:14px;
    color:#C7CDD3;
  }
  .modal-body{
    padding:20px 24px 24px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 20px;
  }
  .field{
    border-bottom:1px solid var(--line-soft);
    padding-bottom:8px;
  }
  .field .flabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .field .fval{
    font-size:14px;
    color:var(--ink);
    font-weight:500;
  }
  .field.full{grid-column:1 / -1;}
  .score-pill{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    padding:2px 10px;
    border-radius:12px;
    background:var(--ok);
    color:#fff;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Admin &amp; Executive Hiring — Candidate Registry</div>
  <h1>Candidates, indexed by last designation held</h1>
  <div class="subhead">Select a designation on the left to see every candidate who last served in that role. Click any candidate to open their full file.</div>
  <div class="stats-row">
    <div class="stat"><div class="num" id="statCandidates">0</div><div class="lbl">Candidates</div></div>
    <div class="stat"><div class="num" id="statDesignations">0</div><div class="lbl">Designations</div></div>
  </div>
</header>

<div class="wrap">
  <aside class="sidebar">
    <div class="sidebar-head"><span class="tab-label">Last Designations</span></div>
    <div class="search-box"><input type="text" id="desigSearch" placeholder="Filter designations…"></div>
    <ul class="designation-list" id="desigList"></ul>
  </aside>

  <main class="main">
    <div class="main-head">
      <h2 id="mainTitle">All candidates</h2>
      <span class="count-badge" id="mainCount"></span>
    </div>
    <div class="filters-row">
      <div class="name-search-box"><input type="text" id="nameSearch" placeholder="Search candidates by name…"></div>
      <div class="gender-filter" id="genderFilter">
        <button class="gender-chip active" data-gender="all">All</button>
        <button class="gender-chip" data-gender="male">Male</button>
        <button class="gender-chip" data-gender="female">Female</button>
        <button class="gender-chip" data-gender="other">Other</button>
      </div>
    </div>
    <div class="candidate-grid" id="candidateGrid"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

function normDesig(s){
  return (s || '').trim().replace(/\s+/g,' ');
}
function desigKey(s){
  return normDesig(s).toLowerCase();
}

// Group by normalized designation, keep most frequent original casing as label
const groups = {};
CANDIDATES.forEach(c => {
  const raw = normDesig(c.designation);
  if(!raw) return;
  const key = desigKey(raw);
  if(!groups[key]) groups[key] = { label: raw, labelCounts: {}, items: [] };
  groups[key].items.push(c);
  groups[key].labelCounts[raw] = (groups[key].labelCounts[raw] || 0) + 1;
});
Object.values(groups).forEach(g => {
  g.label = Object.entries(g.labelCounts).sort((a,b)=>b[1]-a[1])[0][0];
});

let designationKeys = Object.keys(groups).sort((a,b) => groups[b].items.length - groups[a].items.length);
let activeKey = null; // null = show all
let nameQuery = ''; // name search filter
let genderFilter = 'all'; // 'all' | 'male' | 'female' | 'other'

function matchesGender(c){
  if(genderFilter === 'all') return true;
  const g = (c.gender || '').trim().toLowerCase();
  if(genderFilter === 'male') return g === 'male';
  if(genderFilter === 'female') return g === 'female';
  return g !== 'male' && g !== 'female'; // 'other' bucket: blank, unspecified, etc.
}

document.getElementById('statCandidates').textContent = CANDIDATES.length;
document.getElementById('statDesignations').textContent = designationKeys.length;

const desigListEl = document.getElementById('desigList');
const gridEl = document.getElementById('candidateGrid');
const mainTitle = document.getElementById('mainTitle');
const mainCount = document.getElementById('mainCount');

function renderDesigList(filterText){
  desigListEl.innerHTML = '';
  const ft = (filterText || '').toLowerCase();

  const allLi = document.createElement('li');
  allLi.className = 'desig-item' + (activeKey === null ? ' active' : '');
  allLi.innerHTML = `<span class="desig-name">All designations</span><span class="desig-count">${CANDIDATES.filter(c=>normDesig(c.designation)).length}</span>`;
  allLi.onclick = () => { activeKey = null; renderDesigList(document.getElementById('desigSearch').value); renderGrid(); };
  desigListEl.appendChild(allLi);

  designationKeys
    .filter(k => groups[k].label.toLowerCase().includes(ft))
    .forEach(k => {
      const g = groups[k];
      const li = document.createElement('li');
      li.className = 'desig-item' + (activeKey === k ? ' active' : '');
      li.innerHTML = `<span class="desig-name" title="${g.label}">${g.label}</span><span class="desig-count">${g.items.length}</span>`;
      li.onclick = () => { activeKey = k; renderDesigList(document.getElementById('desigSearch').value); renderGrid(); };
      desigListEl.appendChild(li);
    });
}

function fieldHtml(label, val){
  return `<div class="field"><div class="flabel">${label}</div><div class="fval">${val && val.length ? escapeHtml(val) : '—'}</div></div>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderGrid(){
  let list;
  if(activeKey === null){
    list = CANDIDATES.filter(c => normDesig(c.designation));
    mainTitle.textContent = 'All candidates';
  } else {
    list = groups[activeKey].items;
    mainTitle.textContent = groups[activeKey].label;
  }
  if(nameQuery){
    list = list.filter(c => (c.name || '').toLowerCase().includes(nameQuery));
  }
  list = list.filter(matchesGender);
  mainCount.textContent = list.length + (list.length === 1 ? ' candidate' : ' candidates');

  gridEl.innerHTML = '';
  if(list.length === 0){
    gridEl.innerHTML = '<div class="empty-state">No candidates found.</div>';
    return;
  }
  list.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(c.id);
    card.innerHTML = `
      <div class="card-name">${escapeHtml(c.name || 'Unnamed')}</div>
      <div class="card-desig">${escapeHtml(c.designation || '—')}</div>
      <div class="card-meta">
        <span>${escapeHtml(c.location || '—')}</span>
        <span>· ${escapeHtml(c.experience || '—')}</span>
        ${c.jdScore ? `<span>· Fit ${escapeHtml(c.jdScore)}/4</span>` : ''}
      </div>
      <a class="card-link" href="#candidate-${c.id}">View full file</a>
      ${c.resumeLink ? `<br><a class="card-resume" href="${escapeHtml(c.resumeLink)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📄 View resume</a>` : '<br><span class="card-no-resume">No resume on file</span>'}
    `;
    gridEl.appendChild(card);
  });
}

function openModal(id){
  const c = CANDIDATES.find(x => x.id === id);
  if(!c) return;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <div class="modal-id">Candidate #${String(c.id).padStart(3,'0')}</div>
      <div class="modal-name">${escapeHtml(c.name || 'Unnamed')}</div>
      <div class="modal-desig">${escapeHtml(c.designation || '—')}${c.lastCompany ? ' · ' + escapeHtml(c.lastCompany) : ''}</div>
    </div>
    <div class="modal-body">
      <div class="field-grid">
        ${fieldHtml('Age', c.age)}
        ${fieldHtml('Gender', c.gender)}
        ${fieldHtml('Mobile', c.mobile)}
        ${fieldHtml('Current location', c.location)}
        ${fieldHtml('Total experience', c.experience)}
        ${fieldHtml('Notice period', c.notice)}
        ${fieldHtml('Current / last salary', c.currentSalary)}
        ${fieldHtml('Expected salary', c.expectedSalary)}
        ${fieldHtml('Last company', c.lastCompany)}
        ${fieldHtml('Last company location', c.lastCompanyLoc)}
        ${fieldHtml('Immediate joiner', c.immediateJoiner)}
        ${fieldHtml('Highest education', c.education)}
        <div class="field full"><div class="flabel">Reason for leaving</div><div class="fval">${c.reasonLeaving && c.reasonLeaving.length ? escapeHtml(c.reasonLeaving) : '—'}</div></div>
        <div class="field full"><div class="flabel">Resume</div><div class="fval">${c.resumeLink ? `<a href="${escapeHtml(c.resumeLink)}" target="_blank" rel="noopener" style="color:var(--steel);font-weight:600;">Open resume ↗</a>` : '—'}</div></div>
        <div class="field full"><div class="flabel">JD fit score</div><div class="fval">${c.jdScore ? `<span class="score-pill">${escapeHtml(c.jdScore)} / 4</span>` : '—'}</div></div>
      </div>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
  history.replaceState(null, '', '#candidate-' + c.id);
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  history.replaceState(null, '', location.pathname);
}
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if(e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

document.getElementById('desigSearch').addEventListener('input', (e) => {
  renderDesigList(e.target.value);
});

document.getElementById('nameSearch').addEventListener('input', (e) => {
  nameQuery = e.target.value.trim().toLowerCase();
  renderGrid();
});

document.querySelectorAll('.gender-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    genderFilter = btn.dataset.gender;
    document.querySelectorAll('.gender-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  });
});

// Deep-link support: #candidate-<id> opens that file directly
function handleHash(){
  const m = location.hash.match(/^#candidate-(\d+)$/);
  if(m) openModal(parseInt(m[1], 10));
}
window.addEventListener('hashchange', handleHash);

renderDesigList('');
renderGrid();
handleHash();
</script>
